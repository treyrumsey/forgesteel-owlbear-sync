# sync-steel:begin
# fs-web's nginx config (Dockerfile.sync-steel): upstream's nginx/default.conf plus the Sync Steel blocks
# between these markers. nginx.test.ts fails if the rest drifts from upstream's file.
#
# Owlbear Rodeo fetches the extension's manifest and icons cross-origin, from its own site
map $http_origin $sync_steel_owlbear_origin {
    ~^https://([a-z0-9-]+\.)*owlbear\.rodeo$ $http_origin;
    default "";
}
# sync-steel:end

types {
    font/otf otf;
    font/ttf ttf;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    font/otf
    font/ttf
    font/woff2
    text/css
    text/javascript
    text/plain
    text/xml
    image/svg+xml;

server {
  listen 80;
  add_header Cache-Control no-cache;
  # sync-steel:begin
  # The Owlbear extension (obr-extension/), at /owlbear/manifest.json. No app fallback: a missing file is a 404.
  location /owlbear/ {
    root   /usr/share/nginx/html;
    try_files $uri =404;
    expires -1;
    add_header Access-Control-Allow-Origin $sync_steel_owlbear_origin;
    add_header Vary Origin;
  }
  # sync-steel:end

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
    expires -1;
  }

  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html;
  }

  location /healthz {
    access_log off;
    return 200 'healthy';
    add_header Content-Type text/plain;
  }
}
