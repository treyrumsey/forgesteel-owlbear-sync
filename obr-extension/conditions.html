<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Conditions</title>
	</head>
	<body>
		<main>
			<h1><span id="hero-name">Hero</span>'s conditions</h1>
			<p id="conditions-note" class="note">Loading…</p>
			<ul id="conditions" class="conditions"></ul>
			<section>
				<h2>Add a condition</h2>
				<form id="add-form" class="grid">
					<label>Condition
						<select id="type"></select>
					</label>
					<label>Ends
						<select id="ends"></select>
					</label>
					<label id="text-label" class="wide" hidden>Name
						<input id="text" type="text" maxlength="200" />
					</label>
					<div class="buttons wide">
						<button id="add-button" type="submit">Add</button>
					</div>
				</form>
			</section>
			<div class="buttons">
				<button id="close-button" type="button">Close</button>
			</div>
		</main>
		<script type="module" src="/src/conditions-modal.ts"></script>
	</body>
</html>
